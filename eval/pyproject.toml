[project]
name = "nodrel-eval"
version = "0.1.0"
description = "Eval harness for nodrel (SPEC §4.9)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
nodrel-eval = "nodrel_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodrel_eval"]
