id: add-function
suite: smoke
prompt: "Add a clamp(value, min, max) function to util.js and export it. It should return value bounded to the range."
files:
  util.js: |
    function identity(x) {
      return x;
    }
    module.exports = { identity };
verify: |
  node -e "const u=require('./util.js'); if(u.clamp(5,1,3)!==3) process.exit(1); if(u.clamp(0,1,3)!==1) process.exit(1); if(u.clamp(2,1,3)!==2) process.exit(1);"
